    if(a.startsWith('back:')){go(a.slice(5));return;}
    if(a.startsWith('event:')){state.event=a.slice(6);state.eventOrigin=state.screen;go('event');return;}
    if(a==='rsvp'){rsvps[state.event]=!rsvps[state.event];maybeRsvps[state.event]=false;render();persist();return;}
    if(a==='rsvp-maybe'){maybeRsvps[state.event]=!maybeRsvps[state.event];rsvps[state.event]=false;render();persist();return;}
    if(a==='visibility'){state.visible=!state.visible;render();persist();return;}
    if(a==='request'){state.requested=!state.requested;render();persist();return;}
    if(a==='save-avatar'){state.outfit={...(state.draft||state.outfit)};state.draft=null;if(state.onboarding)go('ready');else{render();notice('Il tuo look è salvato in questa anteprima.');persist();}return;}
    if(screens[a])go(a);
  });
  root.addEventListener('change',e=>{if(e.target?.id==='qr-camera-capture')decodeCapturedQr(e.target.files?.[0]);});
  let inviteTouchStart=null;
  page.addEventListener('touchstart',e=>{if(state.screen==='invite'&&e.touches.length===1)inviteTouchStart={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});
  page.addEventListener('touchend',e=>{if(state.screen!=='invite'||!inviteTouchStart||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-inviteTouchStart.x,dy=e.changedTouches[0].clientY-inviteTouchStart.y;inviteTouchStart=null;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.4)setInviteMode(dx>0?'scan':'show');},{passive:true});
  root.addEventListener('submit',e=>{if(e.target.id!=='fuori-status-form')return;e.preventDefault();const data=new FormData(e.target);go('event');notice(`${data.get('status')} · visibile agli amici per ${data.get('duration')}. Aggiornamento simulato.`);});
  render();
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{root.style.setProperty('--accent',design.tone==='coral'?'light-dark(#c63e28,#ff9987)':'light-dark(#385cb0,#a9bfff)');root.style.setProperty('--accent-ink',design.tone==='coral'?'light-dark(#fff,#29140f)':'light-dark(#fff,#12254e)');root.style.setProperty('--radius',design.softness+'px');}});tweak.addSelect(design,'tone',{label:'Accento',options:[{label:'Corallo',value:'coral'},{label:'Cobalto',value:'blue'}]});tweak.addSlider(design,'softness',{label:'Angoli',min:16,max:32,unit:'px'});}


  // One sprite component is shared by the wardrobe, groups and friend portraits.
  const friendLooks=[
    {...FuoriHabbo.defaults,top:'#ac94b3',accessory:'cap'},
    {...FuoriHabbo.defaults,top:'#ed5c50',bottom:'#c69f71',skin:'#ae7748',hairstyle:'bob',garment:'tee'},
    {...FuoriHabbo.defaults,top:'#f3e1af',bottom:'#4f7aa2',hair:'#d1803a',hairstyle:'spiky',accessory:'glasses'}
  ];
  mountScene=()=>{
    page.querySelectorAll('.stage').forEach(holder=>{
      const single=holder.dataset.single==='true';
      holder.classList.toggle('single-avatar',single);
      const looks=single?[state.draft||state.outfit]:friendLooks;
      const avatars=looks.map((outfit,index)=>{
        const avatar=document.createElement('habbo-avatar');
        avatar.outfit=outfit;
        avatar.setAttribute('label',single?'Il tuo personaggio':['Vale','Fra','Leo'][index]);
        avatar.setAttribute('direction',single?state.direction:[2,4,3][index]);
        avatar.className='stage-avatar';
        return avatar;
      });
      holder.replaceChildren(...avatars);
    });
    page.querySelectorAll('[data-portrait]').forEach(avatar=>{
      const index=['Vale','Fra','Leo'].indexOf(avatar.dataset.portrait);
      avatar.outfit=friendLooks[index<0?1:index];
    });
  };
  mountScene();
})();
</script>
</div>

<script>document.addEventListener('DOMContentLoaded',()=>globalThis.lucide?.createIcons({attrs:{'aria-hidden':'true'}}));</script>
</body>
