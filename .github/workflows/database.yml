name: Migrazioni database

on:
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/database.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/database.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0
      - name: Avvia PostgreSQL locale
        run: supabase db start
      - name: Applica tutte le migrazioni su database vuoto
        run: supabase db reset --local
      - name: Controlla le funzioni SQL
        run: supabase db lint --local --schema public,private --level error --fail-on error
      - name: Ferma il database locale
        if: always()
        run: supabase stop --no-backup

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: supabase-main
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verifica configurazione del deploy
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Configura il secret GitHub Actions $name."
              exit 1
            fi
          done
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0
      - name: Collega il progetto Supabase
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Controlla le migrazioni pendenti
        run: supabase db push --dry-run
      - name: Applica le migrazioni pendenti
        run: supabase db push --yes
      - name: Verifica la cronologia delle migrazioni
        run: supabase migration list
